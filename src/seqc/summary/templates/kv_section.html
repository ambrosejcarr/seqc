{% extends "section_base.html" %}}
{% block content %}

    <div class="row">
        <div align="right" class="col-sm-4">
            {% for k in keys %}
            {{k}}<br>
            {% endfor %}
        </div>
        <div align="left" class="col-sm-8">
            {% for v in values %}
            {{v}}<br>
            {% endfor %}
        </div>
    </div>
{% endblock %}
